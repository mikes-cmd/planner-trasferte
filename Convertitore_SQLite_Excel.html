<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Convertitore SQLite a Excel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js"></script>
</head>
<body class="flex items-center justify-center h-screen bg-slate-50">

  <div id="drop-zone" class="bg-white p-10 rounded-2xl shadow-xl border-4 border-dashed border-slate-300 text-center max-w-xl w-full transition-all duration-300">
    <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Migrazione SQLite → Excel</h1>
    <p class="text-slate-500 mb-8">Trascina qui il tuo file <b>.sqlite</b> per generare il file Excel</p>
    
    <div id="status" class="hidden px-4 py-3 rounded-lg font-bold text-sm bg-emerald-100 text-emerald-800 border-2 border-emerald-500">
      Elaborazione in corso...
    </div>
  </div>

  <script>
    let SQL;
    window.onload = async () => {
        SQL = await window.initSqlJs(); 
    };

    const dropZone = document.getElementById('drop-zone');
    const statusDiv = document.getElementById('status');

    // Elenco aggiornato con le nuove tabelle dell'Asset Management (As-Maintained)
    const tableNames = [
        "Tecnici", 
        "Luoghi", 
        "Prodotti", 
        "CodiciProblematica", 
        "Trasferte", 
        "Problematiche", 
        "Soluzioni",
        "SistemiDeployati",
        "Sottoinsiemi",
        "CatalogoECP",
        "ApplicazioneECP",
        "ConfigurazioneLock"
    ];

    dropZone.addEventListener('dragover', (e) => { 
        e.preventDefault(); 
        dropZone.classList.add('border-emerald-500', 'bg-emerald-50'); 
    });
    
    dropZone.addEventListener('dragleave', (e) => { 
        e.preventDefault(); 
        dropZone.classList.remove('border-emerald-500', 'bg-emerald-50'); 
    });
    
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault(); 
        dropZone.classList.remove('border-emerald-500', 'bg-emerald-50');
        
        const file = e.dataTransfer.files[0];
        if (!file || !(file.name.endsWith('.sqlite') || file.name.endsWith('.db'))) {
            return alert("Inserisci un file database SQLite (.sqlite o .db)");
        }

        statusDiv.classList.remove('hidden');
        statusDiv.innerText = "Lettura del database in corso...";

        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const uInt8Array = new Uint8Array(event.target.result);
                const db = new SQL.Database(uInt8Array);
                
                statusDiv.innerText = "Generazione fogli Excel...";
                const wb = XLSX.utils.book_new();

                tableNames.forEach(tableName => {
                    try {
                        const res = db.exec(`SELECT * FROM ${tableName}`);
                        
                        if (res.length > 0) {
                            const columns = res[0].columns;
                            const values = res[0].values;
                            
                            const rows = values.map(row => {
                                let obj = {};
                                columns.forEach((col, index) => {
                                    obj[col] = row[index];
                                });
                                return obj;
                            });
                            
                            const ws = XLSX.utils.json_to_sheet(rows);
                            XLSX.utils.book_append_sheet(wb, ws, tableName);
                        } else {
                            const columnsRes = db.exec(`PRAGMA table_info(${tableName})`);
                            if (columnsRes.length > 0) {
                                const headers = columnsRes[0].values.map(v => v[1]);
                                const ws = XLSX.utils.json_to_sheet([], { header: headers });
                                XLSX.utils.book_append_sheet(wb, ws, tableName);
                            }
                        }
                    } catch (e) {
                        console.warn(`Tabella ${tableName} saltata o non trovata.`, e);
                    }
                });

                XLSX.writeFile(wb, "FSM_Database_Export.xlsx");
                statusDiv.innerText = "✅ Conversione completata! File scaricato.";
            } catch (err) { 
                console.error(err); 
                statusDiv.classList.remove('bg-emerald-100', 'text-emerald-800', 'border-emerald-500');
                statusDiv.classList.add('bg-red-100', 'text-red-800', 'border-red-500');
                statusDiv.innerText = "Errore durante la conversione."; 
            }
        };
        reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
